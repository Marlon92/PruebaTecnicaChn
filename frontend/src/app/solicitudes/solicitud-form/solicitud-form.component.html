<h1>Nueva solicitud de prestamo</h1>

<form [formGroup]="form" (ngSubmit)="guardar()" class="formulario">

  <mat-form-field appearance="outline">
    <mat-label>Monto</mat-label>
    <input matInput type="number" formControlName="montoSolicitado">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Plazo</mat-label>
    <input matInput type="number" formControlName="plazoMeses">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Motivo</mat-label>
    <textarea matInput formControlName="motivo" rows="3"></textarea>
  </mat-form-field>

  <div class="acciones">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-raised-button color="primary" type="submit">Enviar</button>
  </div>
</form>
