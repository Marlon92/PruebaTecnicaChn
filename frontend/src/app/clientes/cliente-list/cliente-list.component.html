<div class="cabecera">
  <h1>Clientes</h1>
  <button mat-raised-button color="primary" routerLink="/clientes/nuevo">
    <mat-icon>add</mat-icon>
    Nuevo cliente
  </button>
</div>

<table mat-table [dataSource]="clientes" class="tabla">

  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let cliente">{{ cliente.nombre }} {{ cliente.apellido }}</td>
  </ng-container>

  <ng-container matColumnDef="identificacion">
    <th mat-header-cell *matHeaderCellDef>DPI</th>
    <td mat-cell *matCellDef="let cliente">{{ cliente.numeroIdentificacion }}</td>
  </ng-container>

  <ng-container matColumnDef="contacto">
    <th mat-header-cell *matHeaderCellDef>Contacto</th>
    <td mat-cell *matCellDef="let cliente">
      <div>{{ cliente.correo }}</div>
      <div>{{ cliente.telefono }}</div>
    </td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let cliente">
      <button mat-icon-button [routerLink]="['/clientes', cliente.id, 'solicitudes']" title="Ver solicitudes">
        <mat-icon>request_page</mat-icon>
      </button>
      <button mat-icon-button [routerLink]="['/clientes', cliente.id, 'editar']" title="Editar">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button (click)="eliminar(cliente)" title="Eliminar">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
</table>

<p *ngIf="clientes.length === 0" class="vacio">No hay clientes registrados todavia.</p>
