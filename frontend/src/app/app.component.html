<mat-toolbar color="primary">
  <span>{{ title }}</span>
</mat-toolbar>

<mat-sidenav-container class="contenedor">
  <mat-sidenav mode="side" opened class="menu">
    <mat-nav-list>
      <a mat-list-item routerLink="/clientes" routerLinkActive="activo">
        <mat-icon matListItemIcon>people</mat-icon>
        <span matListItemTitle>Clientes</span>
      </a>
      <a mat-list-item routerLink="/solicitudes" routerLinkActive="activo">
        <mat-icon matListItemIcon>request_page</mat-icon>
        <span matListItemTitle>Solicitudes de prestamo</span>
      </a>
      <a mat-list-item [routerLink]="['/solicitudes']" [queryParams]="{ estado: 'APROBADA' }" routerLinkActive="activo">
        <mat-icon matListItemIcon>account_balance</mat-icon>
        <span matListItemTitle>Prestamos aprobados</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="contenido">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
